apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: catalog-data
  namespace: fcg-phase2
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogapi
  namespace: fcg-phase2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalogapi
  template:
    metadata:
      labels:
        app: catalogapi
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        fsGroup: 1654
      containers:
        - name: catalogapi
          image: viniciuscs84/fcg-catalog-api:sha-65491861dbaeee4d6c4d4797c941a014c847cb4e
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: fcg-config
          env:
            - name: Jwt__SigningKey
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: JWT_SIGNING_KEY
            - name: RabbitMq__UserName
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_USER
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: fcg-secrets
                  key: RABBITMQ_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: catalog-data
---
apiVersion: v1
kind: Service
metadata:
  name: catalogapi
  namespace: fcg-phase2
spec:
  selector:
    app: catalogapi
  ports:
    - name: http
      port: 8080
      targetPort: http
